<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站分类导航</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }
    body {
      background-color: #f7f8fa;
      padding: 40px 20px;
      max-width: 1300px;
      margin: 0 auto;
    }
    .category-wrap {
      margin-bottom: 50px;
    }
    .category-title {
      font-size: 22px;
      color: #222;
      margin-bottom: 20px;
      padding-left: 6px;
      border-left: 4px solid #4080ff;
    }
    .icon-group {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 28px;
    }
    .link-item {
      text-decoration: none;
      text-align: center;
    }
    .icon-img {
      width: 120px;
      height: 120px;
      border-radius: 18px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.1);
      transition: transform 0.28s ease;
      object-fit: cover;
      background: #fff;
    }
    .icon-img:hover {
      transform: scale(1.06);
    }
    .site-name {
      margin-top: 9px;
      font-size: 15px;
      color: #333;
    }
    .footer {
      max-width: 1300px;
      margin: 80px auto 30px auto;
      padding-top: 25px;
      border-top: 1px solid #ddd;
      color: #666;
      font-size: 13px;
      line-height: 1.8;
    }
    .footer p {
      margin: 4px 0;
    }
    .footer .section-title {
      font-weight: bold;
      margin-bottom: 8px;
    }
    .footer a {
      text-decoration: underline;
      color: #06c;
    }
  </style>
</head>
<body>
  <div id="mainBox"></div>

  <script>
    const navData = [
      {
        categoryName: "个人制作网页",
        siteArr: [
          { name: "弹窗祝福", icon: "img/FL_1/img_1.ico", url: "tow.html" },
          { name: "随机抽人", icon: "img/FL_1/img_2.ico", url: "sjcr.html" },
          { name: "留言板",   icon: "img/FL_1/img_3.ico", url: "liuyanban.html" },
          { name: "可不可以", icon: "可不可以/images/default.png", url: "可不可以/index.html" }
        ]
      },
      {
        categoryName: "常用网站",
        siteArr: [
          { name: "百度",     icon: "https://www.baidu.com/favicon.ico",    url: "https://www.baidu.com" },
          { name: "哔哩哔哩", icon: "https://www.bilibili.com/favicon.ico",  url: "https://www.bilibili.com" },
          { name: "豆包",     icon: "img/FL_2/img_3.ico",                    url: "https://www.doubao.com" },
          { name: "抖音",     icon: "img/FL_2/douying.jpeg",                  url: "https://www.douyin.com/" }
        ]
      },
      {
        categoryName: "实用工具",
        siteArr: [
          { name: "菜鸟工具", icon: "https://www.runoob.com/favicon.ico", url: "https://www.runoob.com" }
        ]
      }
    ];

    let htmlStr = '';
    navData.forEach(category => {
      htmlStr += `<div class="category-wrap">
        <h3 class="category-title">${category.categoryName}</h3>
        <div class="icon-group">`;
      category.siteArr.forEach(site => {
        htmlStr += `
          <a class="link-item" href="${site.url}" target="_blank">
            <img class="icon-img" src="${site.icon}" alt="${site.name}">
            <div class="site-name">${site.name}</div>
          </a>`;
      });
      htmlStr += '</div></div>';
    });
    document.getElementById('mainBox').innerHTML = htmlStr;
  </script>

  <div class="footer">
    <p class="section-title">免责声明：</p>
    <p>1. 本站仅做网址导航整理，所有外链均以新标签页跳转第三方网站，本站不存储影视、软件、文档等任何资源，不运营外链站点内容；</p>
    <p>2. 第三方网站的广告、内容、服务由该网站运营方全权负责，本站不对外链安全与合规性承担法律责任；</p>
    <p>3. 若版权方、网站站长发现链接侵权或违规，可通过下方抖音私信反馈，核实后即刻下架对应链接。</p>

    <p class="section-title" style="margin-top:15px;">联系反馈：</p>
    <div style="margin:12px 0;">
      <img src="img/dy_mp.png" alt="抖音扫码联系" style="width:160px;">
    </div>
    <p>抖音号：<a href="https://v.douyin.com/mRKSXtehFD8/" target="_blank">1847463349</a>（点击可直接跳转），打开抖音扫码私信反馈即可</p>
    <p>备注：反馈时附上需要处理的网站名称和链接，方便快速处理</p>
  </div>
</body>
</html>
