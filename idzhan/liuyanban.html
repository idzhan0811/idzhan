<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
      color: #fff;
    }
    .header {
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-content {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { display: flex; align-items: center; gap: 0.75rem; }
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    .logo h1 { font-size: 1.25rem; font-weight: 700; }
    .nav { display: flex; gap: 0.5rem; }
    .nav-btn {
      padding: 0.5rem 1rem; border: none; border-radius: 8px;
      cursor: pointer; font-size: 0.875rem; font-weight: 500;
      transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem;
    }
    .nav-btn.active { background: #667eea; color: white; }
    .nav-btn:not(.active) { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
    .nav-btn:not(.active):hover { background: rgba(255,255,255,0.2); color: white; }
    .main { max-width: 800px; margin: 0 auto; padding: 2rem; }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .card-title {
      font-size: 1.125rem; font-weight: 700; margin-bottom: 1rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 0.875rem; color: rgba(255,255,255,0.8); margin-bottom: 0.5rem; }
    .form-input {
      width: 100%; padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: white; font-size: 1rem; transition: all 0.2s;
    }
    .form-input:focus { outline: none; border-color: #667eea; background: rgba(255,255,255,0.15); }
    .form-input::placeholder { color: rgba(255,255,255,0.4); }
    textarea.form-input { resize: vertical; min-height: 100px; }
    .char-count { text-align: right; font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 0.25rem; }
    .btn {
      padding: 0.75rem 1.5rem; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.4); }
    .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
    .btn-secondary:hover { background: rgba(255,255,255,0.2); }
    .btn-danger { background: rgba(239,68,68,0.2); color: #ef4444; }
    .btn-danger:hover { background: rgba(239,68,68,0.3); }
    .messages-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .messages-count { color: rgba(255,255,255,0.6); font-weight: normal; }
    .message-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 1.25rem; margin-bottom: 1rem;
      transition: all 0.2s; position: relative;
    }
    .message-card:hover { background: rgba(255,255,255,0.08); }
    .message-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.875rem; color: white; flex-shrink: 0;
    }
    .message-meta { flex: 1; }
    .message-author { font-weight: 600; color: white; }
    .message-time { font-size: 0.75rem; color: rgba(255,255,255,0.5); }
    .message-content { color: rgba(255,255,255,0.9); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .message-actions {
      position: absolute; top: 1rem; right: 1rem;
      display: flex; gap: 0.5rem; opacity: 0; transition: opacity 0.2s;
    }
    .message-card:hover .message-actions { opacity: 1; }
    .action-btn {
      width: 32px; height: 32px; border: none; border-radius: 8px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .action-btn svg { width: 16px; height: 16px; }
    .action-btn.edit { background: rgba(59,130,246,0.2); color: #3b82f6; }
    .action-btn.delete { background: rgba(239,68,68,0.2); color: #ef4444; }
    .action-btn:hover { transform: scale(1.1); }
    .empty-state { text-align: center; padding: 3rem 1rem; }
    .empty-icon { font-size: 4rem; margin-bottom: 1rem; }
    .empty-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    .empty-text { color: rgba(255,255,255,0.6); }
    .login-container { max-width: 400px; margin: 4rem auto; }
    .login-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; margin: 0 auto 1.5rem;
    }
    .login-title { text-align: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .login-subtitle { text-align: center; color: rgba(255,255,255,0.6); margin-bottom: 2rem; }
    .login-form .form-input { text-align: center; font-size: 1.25rem; letter-spacing: 0.25rem; }
    .login-form .btn { width: 100%; justify-content: center; }
    .admin-header {
      background: linear-gradient(135deg, rgba(139,92,246,0.2) 0%, rgba(236,72,153,0.2) 100%);
      border: 1px solid rgba(139,92,246,0.3);
    }
    .admin-info { display: flex; align-items: center; gap: 1rem; }
    .admin-avatar {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
    }
    .admin-stats { flex: 1; }
    .admin-title { font-size: 1.25rem; font-weight: 700; }
    .admin-subtitle { color: rgba(255,255,255,0.6); font-size: 0.875rem; }
    .admin-actions { display: flex; gap: 1rem; flex-wrap: wrap; }
    .password-form { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .password-form .form-input { flex: 1; min-width: 200px; }
    .toast {
      position: fixed; top: 5rem; left: 50%; transform: translateX(-50%);
      padding: 0.75rem 1.5rem; border-radius: 50px; font-weight: 500;
      z-index: 1000; animation: slideDown 0.3s ease;
    }
    .toast.success { background: #10b981; color: white; }
    .toast.error { background: #ef4444; color: white; }
    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .footer { text-align: center; padding: 2rem; color: rgba(255,255,255,0.4); font-size: 0.875rem; }
    .hidden { display: none !important; }
    @media (max-width: 640px) {
      .header-content { flex-direction: column; gap: 1rem; }
      .nav { width: 100%; justify-content: center; }
      .main { padding: 1rem; }
      .admin-actions { flex-direction: column; }
      .admin-actions .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="toast" class="toast hidden"></div>
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <div class="logo-icon">💬</div>
          <h1>留言板</h1>
        </div>
        <nav class="nav">
          <button class="nav-btn active" data-view="board" onclick="navigate('board')">📋 留言板</button>
          <button class="nav-btn" data-view="admin" onclick="navigate('admin')">🔐 管理</button>
        </nav>
      </div>
    </header>
    <main class="main">
      <!-- Board View -->
      <div id="board-view">
        <div class="card">
          <h2 class="card-title"><span>✏️</span><span id="form-title">发布留言</span></h2>
          <form id="message-form" onsubmit="handleSubmit(event)">
            <input type="hidden" id="editing-id" value="">
            <div class="form-group">
              <label class="form-label">昵称</label>
              <input type="text" id="author" class="form-input" placeholder="输入你的昵称" maxlength="20" required>
            </div>
            <div class="form-group">
              <label class="form-label">留言内容</label>
              <textarea id="content" class="form-input" placeholder="写下你想说的话..." maxlength="500" required></textarea>
              <div class="char-count"><span id="char-count">0</span>/500</div>
            </div>
            <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
              <button type="submit" class="btn btn-primary">
                <span id="submit-icon">🚀</span>
                <span id="submit-text">发布留言</span>
              </button>
              <button type="button" id="cancel-edit-btn" class="btn btn-secondary hidden" onclick="cancelEdit()">取消编辑</button>
            </div>
          </form>
        </div>
        <div class="messages-header">
          <h2 class="card-title"><span>📋</span>全部留言 <span class="messages-count">(<span id="message-count">0</span>)</span></h2>
        </div>
        <div id="messages-list"></div>
      </div>
      <!-- Login View -->
      <div id="login-view" class="hidden">
        <div class="login-container">
          <div class="card">
            <div class="login-icon">🔐</div>
            <h2 class="login-title">管理员登录</h2>
            <p class="login-subtitle">请输入管理员密码</p>
            <form class="login-form" onsubmit="handleLogin(event)">
              <div class="form-group">
                <input type="password" id="login-password" class="form-input" placeholder="输入密码" required>
              </div>
              <button type="submit" class="btn btn-primary">登录</button>
            </form>
            <button onclick="navigate('board')" class="btn btn-secondary" style="width:100%;margin-top:1rem;justify-content:center;">← 返回留言板</button>
          </div>
        </div>
      </div>
      <!-- Admin View -->
      <div id="admin-view" class="hidden">
        <div class="card admin-header">
          <div class="admin-info">
            <div class="admin-avatar">👑</div>
            <div class="admin-stats">
              <div class="admin-title">管理后台</div>
              <div class="admin-subtitle">共 <span id="admin-count">0</span> 条留言</div>
            </div>
            <button onclick="logout()" class="btn btn-secondary">退出登录</button>
          </div>
        </div>
        <div class="card">
          <form class="password-form" onsubmit="handleChangePassword(event)">
            <input type="password" id="new-password" class="form-input" placeholder="输入新密码（至少4位）" minlength="4">
            <button type="submit" class="btn btn-primary">确认修改</button>
          </form>
        </div>
        <h2 class="card-title" style="margin-top:2rem;"><span>🛠️</span>留言管理</h2>
        <div id="admin-messages-list"></div>
      </div>
    </main>
    <footer class="footer">💬 留言板 · 数据存储在云数据库</footer>
  </div>
  <script>
    const avatarColors = [
      '#ef4444','#f97316','#f59e0b','#eab308',
      '#84cc16','#22c55e','#10b981','#14b8a6',
      '#06b6d4','#0ea5e9','#3b82f6','#6366f1',
      '#8b5cf6','#a855f7','#d946ef','#ec4899'
    ];

    let adminLoggedIn = false;
    let adminPassword = '';
    let editingId = null;
    let messagesCache = [];

    function getAvatarColor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      return avatarColors[Math.abs(hash) % avatarColors.length];
    }

    function getInitials(name) {
      return name.slice(0, 2).toUpperCase();
    }

    function formatTime(isoString) {
      const date = new Date(isoString);
      const diff = Date.now() - date.getTime();
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
      if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
      return (date.getMonth() + 1) + '月' + date.getDate() + '日 ' +
             String(date.getHours()).padStart(2, '0') + ':' +
             String(date.getMinutes()).padStart(2, '0');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showToast(message, type) {
      type = type || 'success';
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast ' + type;
      setTimeout(function() { toast.classList.add('hidden'); }, 3000);
    }

    function authHeaders() {
      return adminLoggedIn ? { 'X-Admin-Password': adminPassword } : {};
    }

    async function apiGet(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function apiPost(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function apiPut(path, body, withAuth) {
      var headers = { 'Content-Type': 'application/json' };
      if (withAuth) Object.assign(headers, authHeaders());
      var res = await fetch(path, { method: 'PUT', headers: headers, body: JSON.stringify(body) });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function apiDelete(path) {
      var res = await fetch(path, { method: 'DELETE', headers: authHeaders() });
      if (!res.ok) throw new Error(await res.text());
    }

    function navigate(view) {
      document.getElementById('board-view').classList.add('hidden');
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('admin-view').classList.add('hidden');
      document.querySelectorAll('.nav-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      if (view === 'board') {
        document.getElementById('board-view').classList.remove('hidden');
      } else if (view === 'admin') {
        if (adminLoggedIn) {
          document.getElementById('admin-view').classList.remove('hidden');
          renderAdminMessages();
        } else {
          document.getElementById('login-view').classList.remove('hidden');
        }
      }
    }

    function messageCardHtml(msg, isAdmin, adminAlwaysVisible) {
      adminAlwaysVisible = adminAlwaysVisible || false;
      return '<div class="message-card" data-id="' + msg.id + '">' +
        '<div class="message-header">' +
          '<div class="avatar" style="background:' + getAvatarColor(msg.author) + '">' +
            getInitials(msg.author) +
          '</div>' +
          '<div class="message-meta">' +
            '<div class="message-author">' + escapeHtml(msg.author) + '</div>' +
            '<div class="message-time">' + formatTime(msg.createdAt) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="message-content">' + escapeHtml(msg.content) + '</div>' +
        (isAdmin ?
          '<div class="message-actions"' + (adminAlwaysVisible ? ' style="opacity:1"' : '') + '>' +
            '<button class="action-btn edit" onclick="editMessage(' + msg.id + ')" title="编辑">' +
              '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>' +
            '</button>' +
            '<button class="action-btn delete" onclick="deleteMessage(' + msg.id + ')" title="删除">' +
              '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>' +
            '</button>' +
          '</div>'
        : '') +
        '</div>';
    }

    function renderMessages() {
      var list = document.getElementById('messages-list');
      var count = document.getElementById('message-count');
      count.textContent = messagesCache.length;
      if (messagesCache.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div><div class="empty-title">还没有留言</div><div class="empty-text">快来写下第一条留言吧！</div></div>';
        return;
      }
      list.innerHTML = messagesCache.map(function(m) { return messageCardHtml(m, adminLoggedIn, false); }).join('');
    }

    function renderAdminMessages() {
      var list = document.getElementById('admin-messages-list');
      var count = document.getElementById('admin-count');
      count.textContent = messagesCache.length;
      if (messagesCache.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-title">暂无留言</div><div class="empty-text">管理后台暂无数据</div></div>';
        return;
      }
      list.innerHTML = messagesCache.map(function(m) { return messageCardHtml(m, true, true); }).join('');
    }

    async function loadAndRender() {
      try {
        messagesCache = await apiGet('/api/messages');
        renderMessages();
        if (adminLoggedIn) renderAdminMessages();
      } catch (e) {
        showToast('加载留言失败', 'error');
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      var author = document.getElementById('author').value.trim();
      var content = document.getElementById('content').value.trim();
      if (!author || !content) { showToast('请填写昵称和留言内容', 'error'); return; }
      try {
        if (editingId !== null) {
          await apiPut('/api/messages/' + editingId, { author: author, content: content }, true);
          showToast('留言修改成功！');
          cancelEdit();
        } else {
          await apiPost('/api/messages', { author: author, content: content });
          document.getElementById('content').value = '';
          document.getElementById('char-count').textContent = '0';
          showToast('留言发布成功！');
        }
        await loadAndRender();
      } catch (err) {
        showToast(err.message || '操作失败', 'error');
      }
    }

    function editMessage(id) {
      var msg = messagesCache.find(function(m) { return m.id === id; });
      if (!msg) return;
      editingId = id;
      document.getElementById('editing-id').value = id;
      document.getElementById('author').value = msg.author;
      document.getElementById('content').value = msg.content;
      document.getElementById('char-count').textContent = msg.content.length;
      document.getElementById('form-title').textContent = '编辑留言';
      document.getElementById('submit-icon').textContent = '💾';
      document.getElementById('submit-text').textContent = '保存修改';
      document.getElementById('cancel-edit-btn').classList.remove('hidden');
      navigate('board');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('editing-id').value = '';
      document.getElementById('author').value = '';
      document.getElementById('content').value = '';
      document.getElementById('char-count').textContent = '0';
      document.getElementById('form-title').textContent = '发布留言';
      document.getElementById('submit-icon').textContent = '🚀';
      document.getElementById('submit-text').textContent = '发布留言';
      document.getElementById('cancel-edit-btn').classList.add('hidden');
    }

    async function deleteMessage(id) {
      if (!confirm('确定要删除这条留言吗？')) return;
      try {
        await apiDelete('/api/messages/' + id);
        showToast('留言已删除');
        await loadAndRender();
      } catch (err) {
        showToast(err.message || '删除失败', 'error');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      var password = document.getElementById('login-password').value;
      try {
        var res = await apiPost('/api/admin', { password: password });
        if (res.success) {
          adminLoggedIn = true;
          adminPassword = password;
          showToast('登录成功！');
          navigate('admin');
          document.getElementById('login-password').value = '';
        } else {
          showToast('密码错误', 'error');
        }
      } catch (err) {
        showToast('密码错误', 'error');
      }
    }

    function logout() {
      adminLoggedIn = false;
      adminPassword = '';
      navigate('board');
    }

    async function handleChangePassword(e) {
      e.preventDefault();
      var newPassword = document.getElementById('new-password').value;
      if (newPassword.length < 4) { showToast('密码至少4个字符', 'error'); return; }
      try {
        // 密码修改需要当前密码认证，使用 authHeaders
        var headers = Object.assign({ 'Content-Type': 'application/json' }, authHeaders());
        var res = await fetch('/api/admin', {
          method: 'PUT',
          headers: headers,
          body: JSON.stringify({ currentPassword: adminPassword, newPassword: newPassword })
        });
        if (!res.ok) throw new Error(await res.text());
        adminPassword = newPassword;
        document.getElementById('new-password').value = '';
        showToast('密码修改成功！');
      } catch (err) {
        showToast(err.message || '修改失败', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      var content = document.getElementById('content');
      var charCount = document.getElementById('char-count');
      content.addEventListener('input', function() {
        charCount.textContent = content.value.length;
      });
      loadAndRender();
    });
  </script>
</body>
</html>
