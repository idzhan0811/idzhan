<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可以和我在一起吗？</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="welcomeOverlay" class="welcome-overlay">
    <div class="envelope-wrapper" id="envelopeWrapper">
      <div class="envelope">
        <div class="envelope-seal">❤️</div>
        <div class="envelope-stamp">💮</div>
        <div class="envelope-line line-top"></div>
        <div class="envelope-line line-bottom"></div>
      </div>
      <p class="envelope-hint">轻触拆开</p>
    </div>
  </div>

  <button id="soundToggle" class="sound-btn" title="关闭音乐">🔊</button>

  <div class="wrapper">
    <img id="showImage" src="images/default.png" alt="询问">
    <p id="question" class="text">可以和我在一起吗？</p>
    <div class="buttons">
      <button id="yes">可以</button>
      <button id="no">不可以</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
