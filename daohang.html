<!DOCTYPE html>
<!-- 网页根标签，语言设置中文 -->
<html lang="zh-CN">
<!-- 头部区域：配置网页编码、适配、标题、样式、外部JS -->
<head>
    <!-- 统一字符编码UTF-8，防止中文乱码 -->
    <meta charset="UTF-8">
    <!-- 移动端自适应：手机打开自动适配屏幕宽度 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 浏览器标签页标题 -->
    <title>网站分类导航</title>

    <!-- CSS样式区域：控制页面布局、图标样式、配色、动画 -->
    <style>
        /* 全局初始化：清除所有标签默认内外边距，统一盒模型计算规则 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif; /* 系统默认无衬线字体，全平台兼容 */
        }
        /* 页面主体body样式：背景色、左右内边距、页面最大宽度+居中 */
        body {
            background-color: #f7f8fa; /* 浅灰白背景，护眼不刺眼 */
            padding: 40px 20px;        /* 上下留白40，左右留白20 */
            max-width: 1300px;         /* 页面最宽1300px，避免大屏太宽散乱 */
            margin: 0 auto;            /* 页面整体水平居中 */
        }
        /* 单个分类整块容器（常用网站/工具每一大块） */
        .category-wrap {
            margin-bottom: 50px; /* 分类与分类之间底部间距 */
        }
        /* 分类标题样式（左侧蓝竖线+字体大小颜色） */
        .category-title {
            font-size: 22px;
            color: #222;
            margin-bottom: 20px;      /* 标题和下方图标间距 */
            padding-left: 6px;
            border-left: 4px solid #4080ff; /* 左侧蓝色装饰竖线 */
        }
        /* 图标网格容器：自动自适应排列图标 */
        .icon-group {
            /* 自动填充布局：最小宽度130px，剩余空间均分 */
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 28px; /* 图标之间横向纵向空隙 */
        }
        /* 单个图标链接a标签：取消下划线、文字居中 */
        .link-item {
            text-decoration: none;
            text-align: center;
        }
        /* 图标图片样式：尺寸、圆角、阴影、缩放过渡 */
        .icon-img {
            width: 120px;
            height: 120px;
            border-radius: 18px;               /* 圆角 */
            box-shadow: 0 3px 14px rgba(0,0,0,0.1); /* 卡片阴影立体感 */
            transition: transform 0.28s ease; /* 悬浮缩放过渡动画时长 */
            object-fit: cover;                /* 图片不变形铺满方框 */
            background: #fff;                 /* 图片加载失败白底占位 */
        }
        /* 鼠标悬浮图标放大效果 */
        .icon-img:hover {
            transform: scale(1.06);
        }
        /* 图标下方网站名称文字 */
        .site-name {
            margin-top:9px;
            font-size:15px;
            color:#333;
        }
    </style>

    <!-- 引入外部jQuery（当前代码没用到jq，保留备用后续扩展功能） -->
    <script src="js/jq.js"></script>
</head>

<!-- 页面可视内容区域 -->
<body id="v1">
    <!-- 渲染容器：JS生成的图标全部塞进这个div，原有写死的HTML会被JS覆盖清空 -->
    <div id="mainBox"></div>

    <!-- JS逻辑代码：配置网站数据 + 自动拼接HTML渲染页面 -->
    <script>
        /*=========【配置区：所有分类、网站信息都在这里修改，不用改页面结构】=========*/
        /* navData数组：存放全部分类数据，每一个{}代表一个分类 */
        const navData = [
            {
                categoryName: "个人制作网页", //分类名称（页面显示的标题）
                siteArr: [ //siteArr数组：当前分类下所有网站列表
                    {
                        name: "高考祝福",          //图标下方显示的文字
                        icon: "img/FL_1/img_1.ico", //图标地址（网络图标/本地相对路径）
                        url: "tow.html"            //跳转地址：同级本地html文件，无http代表本地页面
                    },
                  {
                        name: "随机抽人",          //图标下方显示的文字
                        icon: "img/FL_1/img_2.ico", //图标地址（网络图标/本地相对路径）
                        url: "sjcr.html"            //跳转地址：同级本地html文件，无http代表本地页面
                    },  
                  {
                        name: "留言板",          //图标下方显示的文字
                        icon: "img/FL_1/img_3.ico", //图标地址（网络图标/本地相对路径）
                        url: "LiuYanBan.html"            //跳转地址：同级本地html文件，无http代表本地页面
                    },
                ]
            },
          
            {
                categoryName: "常用网站",
                siteArr: [
                    {
                        name: "百度",
                        icon: "https://www.baidu.com/favicon.ico",
                        url: "https://www.baidu.com" //带https=外网网址，新标签打开
                    },
                    {
                        name: "哔哩哔哩",
                        icon: "https://www.bilibili.com/favicon.ico",
                        url: "https://www.bilibili.com"
                    },
                    {
                        name: "豆包",
                        icon: "img/FL_2/img_3.ico",
                        url: "https://www.doubao.com"
                    }
                ]
            },
            {
                categoryName: "实用工具",
                siteArr: [
                    {
                        name: "菜鸟工具",
                        icon: "https://www.runoob.com/favicon.ico",
                        url: "https://www.runoob.com"
                    }
                ]
            },
          /*  {
                categoryName: "影视专区",
                siteArr: [
                    {
                        name: "网易游戏",
                        icon: "https://game.163.com/favicon.ico",
                        url: "https://game.163.com"
                    }
                ]
           */
        ];
        /*======================================================================*/

        //定义空字符串，用来拼接生成完整的HTML代码
        let htmlStr = '';

        //第一层循环：遍历每一个【分类】
        navData.forEach(category => {
            //拼接当前分类外层标题容器代码
            htmlStr += `<div class="category-wrap">
                <h3 class="category-title">${category.categoryName}</h3>
                <div class="icon-group">`;

            //第二层循环：遍历当前分类里面所有【网站】
            category.siteArr.forEach(site => {
                //拼接单个图标+链接HTML代码，${变量}为模板取值
                htmlStr += `
                <a class="link-item" href="${site.url}" target="_blank">
                    <img class="icon-img" src="${site.icon}" alt="${site.name}">
                    <div class="site-name">${site.name}</div>
                </a>
                `;
            });

            //闭合分类图标容器标签
            htmlStr += `</div></div>`;
        });

        //把拼接好的所有HTML代码，插入到页面mainBox容器内渲染显示
        //⚠️注意：body里原来手动写死的页面结构会被这段JS直接覆盖，所以写死的内容不生效
        document.getElementById('mainBox').innerHTML = htmlStr;
    </script>
