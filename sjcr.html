<html lang="zh-CN">
 <!-- 设置网页语言为中文 -->
 <head> 
  <!-- 网页头部区域 --> 
  <meta charset="UTF-8"> 
  <!-- 设置字符编码为UTF-8，兼容中文不乱码 --> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <!-- 移动端自适应：页面宽度适配设备屏幕，初始化缩放1倍 --> 
  <title>高级随机抽签器｜导入导出TXT+批量选人+深色模式</title> 
  <!-- 浏览器标签标题 --> 
  <style>
        /* ========== CSS全局变量：浅色主题配色，统一颜色方便修改 ========== */
        :root{
            --bg:#7d37ed;          /* 页面背景主蓝色 */
            --card:#ffffff;        /* 卡片容器白色背景 */
            --text:#222;           /* 正文文字深色 */
            --inputbg:#fff;        /* 输入框底色 */
            --resbg:#f0f7ff;       /* 结果展示框浅蓝底色 */
            --btn-primary:#2563eb; /* 主按钮蓝色 */
            --btn-danger:#ef4444;  /* 清空按钮红色 */
            --btn-green:#089d6c;   /* 导入导出绿色按钮 */               
            --btn-purple:#7c3aed;  /* 主题切换紫色按钮 */
        }
        /* ========== 深色主题类，切换时给body追加此类即可换深色 ========== */
        .dark{
            --bg:#1e293b;
            --card:#2a374d;
            --text:#eee;
            --inputbg:#334155;
            --resbg:#334155;
            --btn-primary:#3b82f6;
            --btn-danger:#f87171;
            --btn-green:#34d399;
            --btn-purple:#a78bfa;
        }
        /* ========== 全局样式重置：清除默认内外边距、盒模型统一 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        /* ========== body页面主体样式 ========== */
        body {
            background: var(--bg); /* 读取CSS变量背景色 */
            min-height: 100vh;     /* 最小占满浏览器可视高度 */
            padding: 30px 20px;
            transition: background 0.3s ease; /* 主题切换过渡动画0.3秒 */
        }
        /* ========== 外层卡片容器 ========== */
        .wrap {
            max-width: 700px;     /* 卡片最大宽度，大屏不会过宽 */
            margin: 0 auto;       /* 卡片水平居中 */
            background: var(--card);
            border-radius: 16px;  /* 圆角 */
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2); /* 卡片阴影立体效果 */
            transition: background 0.3s ease;
        }
        /* ========== 顶部标题+切换按钮一行布局 ========== */
        .top-bar{
            display:flex;
            justify-content: space-between; /* 左右两端分布 */
            align-items: center;           /* 垂直居中 */
            margin-bottom:15px;
        }
        h1 {
            color: var(--text);
            font-size: 20px;
        }
        /* ========== 名单输入框区域 ========== */
        .item-box {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size:16px;
            margin-bottom:8px;
            color:var(--text);
        }
        textarea {
            width:100%;
            height:160px;
            padding:12px;
            border:1px solid #9995;
            border-radius:8px;
            font-size:15px;
            resize:none; /* 禁止拖动修改文本框大小 */
            background:var(--inputbg);
            color:var(--text);
            outline: none; /* 取消选中黑框 */
        }
        /* 导入导出按钮行布局 */
        .oper-row{
            display:flex;
            gap:10px;
            margin:10px 0;
        }
        /* ========== 抽取人数输入行 ========== */
        .num-box{
            display:flex;
            align-items:center;
            gap:8px;
            margin-bottom:20px;
            color:var(--text);
        }
        #pickNum{
            width:70px;
            padding:6px;
            font-size:16px;
            border-radius:6px;
            border:1px solid #aaa;
            background:var(--inputbg);
            color:var(--text);
            outline: none;
        }
        /* ========== 中奖结果展示框 ========== */
        .result {
            padding:25px;
            background:var(--resbg);
            border-radius:10px;
            text-align:center;
            font-size:32px;
            font-weight:bold;
            color:var(--btn-primary);
            margin:25px 0;
            min-height:90px;
            line-height:1.5;
            transition: all 0.2s;
        }
        /* ========== 滚动抽奖动画：名字快速闪烁缩放 ========== */
        @keyframes rollAnim{
            0%{opacity:0.4;transform:scale(0.95)}
            50%{opacity:1;transform:scale(1.03)}
            100%{opacity:0.4;transform:scale(0.95)}
        }
        /* JS添加此类名开启滚动动画 */
        .rolling{
            animation:rollAnim 0.12s infinite;
        }
        /* ========== 底部按钮组布局 ========== */
        .btn-group {
            display:flex;
            gap:12px;
            flex-wrap:wrap; /* 小屏幕自动换行 */
        }
        /* 通用按钮样式 */
        button,.file-btn {
            flex:1;
            min-width:110px;
            padding:12px;
            border:none;
            border-radius:8px;
            font-size:15px;
            cursor:pointer;
            transition:0.2s;
            color:#fff;
        }
        /* 开始抽奖按钮配色 */
        #startBtn {
            background:var(--btn-primary);
        }
        /* 清空按钮配色 */
        #clearBtn {
            background:var(--btn-danger);
        }
        /* 文件导入按钮配色 */
        .file-btn{
            background:var(--btn-green);
        }
        /* 主题切换按钮配色 */
        #themeBtn{
            background:var(--btn-purple);
        }
        /* 原生文件选择框隐藏，用自定义按钮代替 */
        input[type="file"]{
            display:none;
        }
/*======== 单独定制主题切换按钮样式 ========*/
#themeBtn {
    /* 圆角：999px变成完美胶囊圆钮 */
    border-radius: 999px !important;
    /* 尺寸 */
    padding: 8px 16px !important;
    min-width: unset !important;
    flex: unset !important;
    /* 配色 */
    background: linear-gradient(135deg,#6366f1,#8b5cf6) !important;
    /* 字体 */
    font-size:14px !important;
    letter-spacing:1px;
    /* 鼠标悬浮效果 */
    position:absolute;
    right:400px;
}
#themeBtn:hover{
    filter: brightness(1.15);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px #8b5cf655;
}
#themeBtn:active{
    transform: translateY(0px);
}
    </style> 
  <script src="js/jq.js"></script> 
 </head> 
 <body id="v1"> 
  <!-- 最外层卡片容器 --> 
  <div id="v2" class="wrap"> 
   <!-- 顶部标题+深色切换 --> 
   <div id="v3" class="top-bar"> 
    <h1 id="v4">随机抽签工具</h1> 
   <button id="themeBtn" style="border-radius:15px;">☀/☾</button>
    <table id="v13"> 
    </table>
   </div> 
   <!-- 名单输入区域 --> 
   <div id="v5" class="item-box"> 
    <label id="v6">人员名单（一行一个姓名）：</label> 
    <!-- 姓名输入文本域 --> 
    <textarea id="nameList" placeholder="张三
李四
王五
赵六"></textarea> 
    <!-- 导入导出按钮行 --> 
    <div id="v7" class="oper-row"> 
     <!-- 隐藏原生文件框，label关联点击 --> 
     <label id="v8" class="file-btn" for="fileInput">导入TXT文件</label> 
     <input id="fileInput" type="file" accept=".txt"> 
     <button id="saveTxt" class="file-btn">导出名单为TXT</button> 
    </div> 
   </div> 
   <!-- 设置抽取人数 --> 
   <div id="v9" class="num-box"> 
    <span id="v10">抽取人数：</span> 
    <input type="number" min="1" value="1" id="pickNum"> 
    <span id="v11">人（不可大于总人数）</span> 
   </div> 
   <!-- 中奖结果展示区 --> 
   <div class="result" id="showRes">
     等待抽签... 
   </div> 
   <!-- 功能按钮 --> 
   <div id="v12" class="btn-group"> 
    <button id="startBtn">开始抽奖</button> 
    <button id="clearBtn">清空结果</button> 
   </div> 
  </div> 
  <script>
        // ========== 获取页面DOM元素，缓存节点减少重复查询 ==========
        const listDom = document.getElementById('nameList')     //名单输入框
        const resDom = document.getElementById('showRes')       //结果展示框
        const startBtn = document.getElementById('startBtn')     //开始抽奖按钮
        const clearBtn = document.getElementById('clearBtn')     //清空按钮
        const pickNum = document.getElementById('pickNum')       //抽取人数输入框
        const fileInput = document.getElementById('fileInput')   //文件选择控件
        const saveTxtBtn = document.getElementById('saveTxt')    //导出txt按钮
        const themeBtn = document.getElementById('themeBtn')     //切换主题按钮

        // ========== 全局状态变量 ==========
        let isRoll = false;        //标记：是否正在滚动抽奖，true=抽奖中禁止重复点击
        let rollTimer = null;      //定时器变量，用来存储滚动定时器，结束时销毁
        const ROLL_TIME = 1500;    //【可修改】抽奖滚动总时长 单位ms 1500=1.5秒
        const ROLL_SPEED = 80;     //【可修改】名字切换速度 越小切换越快 单位ms

        // ========== 1.深浅色主题切换事件 ==========
        themeBtn.onclick = () => {
            //给body追加/移除dark类名，CSS自动换深色配色
            document.body.classList.toggle('dark')
        }

        // ========== 2.导入本地TXT文件到文本框 ==========
        fileInput.onchange = function(e){
            //获取用户选中的文件
            const file = e.target.files[0]
            //没有选中文件直接终止
            if(!file) return
            //创建文件读取对象
            const reader = new FileReader()
            //以文本格式读取文件
            reader.readAsText(file)
            //文件读取完成回调
            reader.onload = ev => {
                //读取内容赋值到名单输入框
                listDom.value = ev.target.result
                webtools-static-lert('TXT导入成功！')
            }
        }

        // ========== 3.把当前名单导出下载为TXT文件 ==========
        saveTxtBtn.onclick = () => {
            //去除首尾空格，判断名单是否为空
            const content = listDom.value.trim()
            if(!content){
                webtools-static-lert('名单内容为空，无法导出！')
                return
            }
            //创建文本二进制对象
            const blob = new Blob([content],{type:'text/plain;charset=utf-8'})
            //创建虚拟a标签实现下载
            const a = document.createElement('a')
            a.href = URL.createObjectURL(blob)
            a.download = '抽签名单.txt' //下载后的文件名
            a.click() //模拟点击下载
            webtools-static-lert('名单TXT文件已开始下载！')
        }

        // ========== 4.开始抽奖主逻辑 ==========
        startBtn.onclick = async function(){
            //如果正在滚动抽奖，直接return，防止重复点击（防抖优化）
            if(isRoll) return

            //1.处理名单：按换行切割数组、去除每个名字前后空格、过滤空行
            let rawArr = listDom.value.split('\n').map(item=>item.trim()).filter(item=>item!=='')
            //获取需要抽取的人数，转为数字
            let needPickCount = Number(pickNum.value)

            //===== 各种数据合法性校验 =====
            if(rawArr.length === 0){
                resDom.innerText = '请填写或导入人员名单！'
                return
            }
            if(needPickCount < 1 || isNaN(needPickCount)){
                resDom.innerText = '抽取人数不能小于1！'
                return
            }
            if(needPickCount > rawArr.length){
                resDom.innerText = `最多只能抽取${rawArr.length}人`
                return
            }

            //===== 开启滚动抽奖动画 =====
            isRoll = true                  //标记抽奖进行中
            resDom.classList.add('rolling')//添加滚动闪烁动画样式
            //开启定时器：不停随机切换名字
            rollTimer = setInterval(()=>{
                let randomIndex = Math.floor(Math.random()*rawArr.length)
                resDom.innerText = rawArr[randomIndex]
            }, ROLL_SPEED)

            //延时等待滚动结束
            await new Promise(resolve=>setTimeout(resolve, ROLL_TIME))

            //===== 结束滚动，清除定时器与动画 =====
            clearInterval(rollTimer)
            rollTimer = null
            resDom.classList.remove('rolling')
            isRoll = false

            //===== 随机不重复抽取指定人数（打乱选人） =====
            let resultArr = []
            let tempNameList = [...rawArr] //复制原数组，不破坏原名单
            for(let i=0; i<needPickCount; i++){
                //随机下标
                let idx = Math.floor(Math.random()*tempNameList.length)
                //取出选中名字，从临时数组删除避免重复中奖
                let pickName = tempNameList.splice(idx,1)[0]
                resultArr.push(pickName)
            }
            //展示最终中奖名单
            resDom.innerText = resultArr.join('、')
        }

        // ========== 5.清空结果按钮逻辑 ==========
        clearBtn.onclick = function(){
            //如果存在定时器，先关闭滚动
            if(rollTimer){
                clearInterval(rollTimer)
                rollTimer = null
            }
            isRoll = false
            resDom.classList.remove('rolling')
            resDom.innerText = '等待抽签...'
        }
    </script>  
 </body>
</html>
