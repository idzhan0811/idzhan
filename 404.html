<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <!-- 引入在线图标库（可选，用来加图标） -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
        }
        .box {
            text-align: center;
            /* 浮动动画 */
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .icon {
            font-size: 60px;
            color: #ff7875;
            margin-bottom: 10px;
        }
        .num-404 {
            font-size: 110px;
            font-weight: bold;
            color: #333;
        }
        .desc {
            font-size: 18px;
            color: #888;
            margin: 15px 0 35px;
        }
        .back-home {
            padding: 10px 28px;
            background: #1890ff;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            transition: 0.3s;
        }
        .back-home:hover {
            background: #096dd9;
        }
        @media (max-width: 480px) {
            .num-404 {
                font-size: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <!-- 警告图标 -->
        <i class="fa-solid fa-triangle-exclamation icon"></i>
        <div class="num-404">404</div>
        <p class="desc">该页面不存在、已删除或链接错误</p>
        <a href="/" class="back-home">回到首页</a>
    </div>
</body>
</html>
